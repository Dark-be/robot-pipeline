INFO_LEVEL: INFO  # DEBUG, INFO, ERROR

collect_env:
  num_episode: 50
  save_freq: 30
  visualize_freq: 5
  max_frames: 1800
  enable_rerun: true

collector:
  type: act_hdf5
  save_dir: ./data/8-5/sweep_the_rubbish
  image_format: jpeg

robot:
  name: alicia_piper
  type: alicia_piper_robot
  control_mode: joint
  MASTER_PORT:
    left_arm: "/dev/ttyACM0"
    right_arm: "/dev/ttyACM1"
  SLAVE_PORT:
    left_arm: "can_left"
    right_arm: "can_right"
  CAMERA_SERIALS:
    head: "261222074970"
    left: "/dev/left-camera"
    right: "/dev/right-camera"
  # 仅用于 reset() 初始化模拟操作臂（TestArmController）
  init_qpos:
    master_left_arm: [0, 0, 0.78, 0, -1.57, 0]
    master_right_arm: [0, 0, 0.78, 0, -1.57, 0]

    slave_left_arm: [0, 0.1, 0, 0, 0, 0, 1.0]
    slave_right_arm: [0, 0.1, 0, 0, 0, 0, 1.0]

  # reset() 平滑插值参数（可选，均有默认值）
  reset_step_rad: 0.05    # 单步最大关节增量(rad)，越小越平缓、MIT 力矩越小
  reset_interval: 0.033   # 相邻两步命令的时间间隔(秒)，约 30Hz
  reset_max_time: 5.0    # 复位超时保护(秒)
  sync_step_rad: 0.1     # sync() 跟随步长(rad/帧)，每帧最多向主手目标靠近该值，防止跳变超出限位
