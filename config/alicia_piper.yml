INFO_LEVEL: INFO  # DEBUG, INFO, ERROR

collect:
  task_name: stack_bowls
  type: alicia_piper

  num_episode: 50
  save_freq: 30

collector:
  type: act_hdf5
  save_dir: ./data/
  qpos_keys: ["slave_left_arm", "slave_right_arm"]
  action_keys: ["master_left_arm", "master_right_arm"]
  image_sources: {cam_head: color, cam_left_wrist: color, cam_right_wrist: color}
  append_timestamp: true
  only_moving: true
  move_tolerance: 0.01

robot:
  name: alicia_piper
  type: dual_test_robot
  control_mode: joint
  MASTER_PORT:
    left_arm: "/dev/ttyACM0"
    right_arm: "/dev/ttyACM1"
  SLAVE_PORT:
    left_arm: "can_left"
    right_arm: "can_right"
  CAMERA_SERIALS:
    head: "261222074970"
    left: "/dev/left-camera"
    right: "/dev/right-camera"
  # 仅用于 reset() 初始化模拟操作臂（TestArmController）
  init_qpos:
    master_left_arm: [0, 0, 0.78, 0, -1.57, 0]
    master_right_arm: [0, 0, 0.78, 0, -1.57, 0]

    slave_left_arm: [0, 0, 0, 0, 0, 0]
    slave_left_gripper: 1.0
    slave_right_arm: [0, 0, 0, 0, 0, 0]
    slave_right_gripper: 1.0
