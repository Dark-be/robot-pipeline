INFO_LEVEL: INFO  # DEBUG, INFO, ERROR
collect:
  # 用于文件夹命名
  task_name: stack_bowls
  # 用于文件夹命名
  type: alicia_piper
  # data/stack_bowls/alicia_piper/***.hdf5

  save_dir: ./data/
  save_format: hdf5
  num_episode: 50

  save_freq: 30
  skip_silent_frame: true

act_policy:
  ckpt_dir: ./policy/act/
  chunk_size: 100
  hidden_dim: 512
  dim_feedforward: 3200
  temporal_agg: True
  max_timesteps: 10000
  camera_names: ['cam_head', 'cam_right_wrist']

robot:
  type: alicia_piper_robot
  control_mode: joint
  MASTER_PORT:
    left_arm: "/dev/ttyACM0"
    right_arm: "/dev/ttyACM1"
  SLAVE_PORT:
    left_arm: "can_left"
    right_arm: "can_right"
  CAMERA_SERIALS:
    head: "261222074970"
    left: "/dev/left-camera"
    right: "/dev/right-camera"
  init_qpos:
    slave_left_arm: [0, 0, 0, 0, 0, 0]
    slave_left_gripper: 1.0
    slave_right_arm: [0, 0, 0, 0, 0, 0]
    slave_right_gripper: 1.0
